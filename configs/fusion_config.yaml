# ─────────────────────────────────────────────────────────────────────────────
# Fusion + Generative Content Pipeline Config
# Adaptive Psychological Horror Gaming FYP
# ─────────────────────────────────────────────────────────────────────────────
# Hardware: RTX 5060 (8GB VRAM), 16GB RAM, i7-12700H
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Multi-Modal Fusion
# ─────────────────────────────────────────────────────────────────────────────
# 3 perception models → unified stress level 0-5
#   Video (this repo):  4 classes (calm/stressed/fearful/panic) → needs mapping
#   Audio (Fyp repo):   6 levels directly (Calm..Terrified)
#   Heart Rate (FYP-heartrate): 6 levels directly
# ─────────────────────────────────────────────────────────────────────────────

fusion:
  method: "weighted_average"
  weights:
    video: 0.45
    audio: 0.30
    heartrate: 0.25

  # Video 4-class → 6-level stress mapping
  video_class_to_stress:
    calm: 0         # → Calm
    stressed: 2     # → Nervous
    fearful: 4      # → Frightened
    panic: 5        # → Terrified

  # 6-level stress scale (shared by audio + heartrate)
  stress_levels:
    0: "Calm"
    1: "Wary"
    2: "Nervous"
    3: "Anxious"
    4: "Frightened"
    5: "Terrified"

  # Temporal smoothing
  smoothing:
    method: "ema"
    alpha: 0.3            # EMA weight for new readings
    max_jump: 2           # max ±2 levels per update

  # Graceful degradation when modalities are missing
  degradation:
    strategy: "reweight"  # redistribute weights among available modalities

# ─────────────────────────────────────────────────────────────────────────────
# Visual Generation — Domestic Horror Textures + Entity Skins
# ─────────────────────────────────────────────────────────────────────────────
# SD 1.5 img2img with ControlNet for surface corruption
# SD 1.5 text2img for entity UV texture maps
# ─────────────────────────────────────────────────────────────────────────────

visual_generation:
  model: "runwayml/stable-diffusion-v1-5"
  lora_path: "models/domestic_horror_lora.safetensors"
  controlnet: "lllyasviel/control_v11p_sd15_canny"
  use_fp16: true
  cpu_offload: true

  # Domestic horror scene context (appended to all prompts)
  scene_context: "suburban house interior, domestic setting, 1970s wallpaper, wooden floors, family home"

  # Surface textures — walls, floors, furniture, household surfaces
  surface_prompts:
    0: null  # clean texture, no generation needed
    1: "slight wear, faded paint, dust, small stains, old house texture"
    2: "water stains, peeling wallpaper, scratches, mild dirt, aged"
    3: "deep scratches, dark stains, mold patches, unsettling discoloration"
    4: "bloody handprints, dark smears, deep cracks, disturbing stains, horror"
    5: "blood soaked walls, gore stains, clawed surfaces, nightmare household horror"

  # Entity UV skins — applied to Blender base meshes
  # Entities only appear at stress levels 3-5
  entity_prompts:
    3: "pale humanoid skin, unsettling shadow figure, child-like silhouette, dim lighting, domestic horror"
    4: "dark gaunt figure, hollow eyed humanoid, creepy domestic entity, decayed skin texture"
    5: "terrifying shadow creature, nightmare humanoid, dark distorted figure, horrific skin"

  negative_prompt: "cartoon, anime, bright colors, cheerful, fantasy, dungeon, outdoor, medieval, sci-fi"

  # img2img strength per stress level (0 = no change, 1 = complete override)
  strength_per_level: [0, 0.15, 0.3, 0.45, 0.6, 0.75]
  texture_size: 512
  inference_steps: 20

  # Caching
  cache_dir: "assets/textures/cached"
  entity_skin_dir: "assets/entities/skins"
  max_cache_items: 50

# ─────────────────────────────────────────────────────────────────────────────
# Audio Generation — Domestic Horror Ambient
# ─────────────────────────────────────────────────────────────────────────────
# AudioLDM text-to-audio for horror ambience
# Alternates VRAM with SD (can't both fit in 8GB)
# ─────────────────────────────────────────────────────────────────────────────

audio_generation:
  model: "cvssp/audioldm-s-full-v2"
  use_fp16: true
  cpu_offload: true

  scene_context: "inside an old empty house at night"

  # Domestic horror audio prompts per stress level
  prompts_per_level:
    0: "{scene_context}, quiet ambient room tone, distant clock ticking"
    1: "{scene_context}, wooden floor creaking, settling sounds, distant traffic"
    2: "{scene_context}, pipes clanking, wind through old windows, faint tapping"
    3: "{scene_context}, faint whispers, water dripping, stairs creaking upstairs"
    4: "{scene_context}, distant sobbing, doors slamming, hushed voices, running footsteps"
    5: "{scene_context}, screaming nearby, pounding walls, distorted child laughter, chaos"

  duration_sec: 10.0
  sample_rate: 16000
  inference_steps: 20
  lookahead_buffer: 2     # pre-generate N clips ahead per active level
  crossfade_sec: 2.0      # crossfade duration between clips

  cache_dir: "assets/audio/cached"

# ─────────────────────────────────────────────────────────────────────────────
# Camera FX — Real-Time Face Distortion (CPU, 30+ FPS)
# ─────────────────────────────────────────────────────────────────────────────
# Psychological horror: subtle uncanny distortions, not grotesque
# MediaPipe face mesh + OpenCV warping
# Zero VRAM cost — runs entirely on CPU
# ─────────────────────────────────────────────────────────────────────────────

camera_fx:
  face_mesh_confidence: 0.5

  effects_per_level:
    0: {enabled: false}
    1: {warp: 0.02, desaturation: 0.1, vignette: 0.1}
    2: {warp: 0.05, desaturation: 0.2, shadow_edges: 0.1, color_shift_hue: -5}
    3: {warp: 0.10, desaturation: 0.3, shadow_edges: 0.25, eye_dark: 0.2, flicker: 0.02}
    4: {warp: 0.18, desaturation: 0.5, shadow_edges: 0.4, eye_dark: 0.4, flicker: 0.05,
        peripheral_figures: 0.3}
    5: {warp: 0.30, desaturation: 0.7, shadow_edges: 0.6, eye_dark: 0.6, flicker: 0.1,
        peripheral_figures: 0.5, glitch: 0.3}

  # Peripheral vision gaslighting — distortions fade when player looks directly
  gaze_trick:
    enabled: true
    fade_out_on_direct_gaze_ms: 500
    fade_in_on_peripheral_ms: 1000

# ─────────────────────────────────────────────────────────────────────────────
# VRAM Management — Strict Alternation (8GB budget)
# ─────────────────────────────────────────────────────────────────────────────
# SD and AudioLDM cannot coexist in VRAM
# Background thread swaps them as needed
# ─────────────────────────────────────────────────────────────────────────────

vram:
  priority_queue_order: ["texture_on_demand", "audio_buffer_refill"]
  unload_between_models: true
  empty_cache_after_unload: true
